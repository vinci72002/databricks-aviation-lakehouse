resources:
  jobs:
    aviation_pipeline:
      name: aviation-lakehouse-${var.env}

      # Prevent overlapping runs that modify the same watermark.
      max_concurrent_runs: 1

      tasks:
        - task_key: environment_setup
          notebook_task:
            notebook_path: ../notebooks/production/00_environment_setup.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: bronze
          depends_on:
            - task_key: environment_setup
          notebook_task:
            notebook_path: ../notebooks/production/01_bronze_telemetry.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/production/02_silver_telemetry.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/production/03_gold_incremental.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              inject_failure: "false"

        - task_key: aircraft_scd2
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/production/04_scd2_aircraft.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: dq_gate
          depends_on:
            - task_key: aircraft_scd2
          notebook_task:
            notebook_path: ../notebooks/production/05_dq_failure_recovery.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              inject_failure: "false"
