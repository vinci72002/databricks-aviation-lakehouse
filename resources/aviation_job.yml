resources:
  jobs:
    aviation_pipeline:
      name: aviation-lakehouse-${var.env}
      max_concurrent_runs: 1
      permissions:
        - user_name: vinci72001@gmail.com
          level: IS_OWNER
        - service_principal_name: "33312777-70fd-4c4f-b1c0-342c13512e3c"
          level: CAN_MANAGE

      schedule:
        quartz_cron_expression: "0 0/20 * * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED

      tasks:
        - task_key: environment_setup
          notebook_task:
            notebook_path: ../notebooks/production/00_environment_setup.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: bronze
          depends_on:
            - task_key: environment_setup
          notebook_task:
            notebook_path: ../notebooks/production/01_bronze_telemetry.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/production/02_silver_telemetry.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/production/03_gold_incremental.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              inject_failure: "false"

        - task_key: aircraft_scd2
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/production/04_scd2_aircraft.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}

        - task_key: dq_gate
          depends_on:
            - task_key: aircraft_scd2
          notebook_task:
            notebook_path: ../notebooks/production/05_dq_failure_recovery.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              inject_failure: "false"
