bundle:
  name: databricks-aviation-lakehouse

include:
  - resources/*.yml

variables:
  env:
    description: Pipeline environment
    default: dev

  schedule_status:
    description: Job schedule status
    default: PAUSED

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-0eebcb7a-d44b.cloud.databricks.com
      root_path: /Workspace/Users/vinci72001@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      env: dev
      schedule_status: UNPAUSED

    permissions:
      - service_principal_name: "33312777-70fd-4c4f-b1c0-342c13512e3c"
        level: CAN_MANAGE

    resources:
      jobs:
        aviation_pipeline:
          permissions:
            - user_name: vinci72001@gmail.com
              level: IS_OWNER

  prod:
    workspace:
      host: https://dbc-0eebcb7a-d44b.cloud.databricks.com
      root_path: /Workspace/Users/33312777-70fd-4c4f-b1c0-342c13512e3c/.bundle/${bundle.name}/${bundle.target}

    variables:
      env: prod
      schedule_status: PAUSED

    run_as:
      service_principal_name: "33312777-70fd-4c4f-b1c0-342c13512e3c"

    permissions:
      - user_name: vinci72001@gmail.com
        level: CAN_MANAGE

    resources:
      jobs:
        aviation_pipeline:
          permissions:
            - service_principal_name: "33312777-70fd-4c4f-b1c0-342c13512e3c"
              level: IS_OWNER
