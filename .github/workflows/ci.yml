name: Aviation Lakehouse CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python syntax and configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q common notebooks/production tests

      - name: Run configuration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
